<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectAEE - Versão Simples</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">ConectAEE - Sistema Direto</h1>
        
        <!-- Login simples -->
        <div id="loginSection" class="bg-white rounded-lg shadow-md p-6 mb-6">
            <div class="max-w-md mx-auto">
                <h2 class="text-xl font-bold mb-4 text-center">Login</h2>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="loginEmail" value="admin@teste.com" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Senha</label>
                    <input type="password" id="loginPassword" value="123456" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                </div>
                <button onclick="fazerLogin()" class="w-full bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    <i class="fas fa-signin mr-2"></i>Entrar
                </button>
                <p class="text-sm text-gray-500 mt-2 text-center">Credenciais padrão: admin@teste.com / 123456</p>
            </div>
        </div>
        
        <!-- Conteúdo principal (inicialmente oculto) -->
        <div id="mainContent" class="hidden">
        
        <!-- Modal de Feedback -->
        <div id="modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
            <div class="flex items-center justify-center min-h-screen">
                <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                    <div class="flex items-center mb-4">
                        <div id="modalIcon" class="w-12 h-12 rounded-full mr-4 flex items-center justify-center">
                            <i id="modalIconClass" class="text-2xl"></i>
                        </div>
                        <h3 id="modalTitle" class="text-lg font-semibold"></h3>
                    </div>
                    <p id="modalMessage" class="text-gray-600 mb-4"></p>
                    <button onclick="closeModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full">
                        OK
                    </button>
                </div>
            </div>
        </div>

        <!-- Menu de Navegação -->
        <div class="bg-white rounded-lg shadow-md p-4 mb-6">
            <div class="flex flex-wrap gap-4">
                <button onclick="showSection('legislacoes')" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    <i class="fas fa-book mr-2"></i>Legislações
                </button>
                <button onclick="showSection('alunos')" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    <i class="fas fa-users mr-2"></i>Alunos
                </button>
                <button onclick="showSection('relatorios')" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    <i class="fas fa-chart-bar mr-2"></i>Relatórios
                </button>
                <button onclick="showSection('entrevistas')" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    <i class="fas fa-clipboard-list mr-2"></i>Entrevistas
                </button>
            </div>
        </div>

        <!-- Seção de Legislações -->
        <div id="legislacoes" class="section bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">Legislações</h2>
            
            <!-- Formulário para adicionar legislação -->
            <form id="legislacaoForm" class="mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Título</label>
                        <input type="text" id="legislacaoTitulo" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Descrição</label>
                        <input type="text" id="legislacaoDescricao" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    </div>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Arquivo PDF</label>
                    <input type="file" id="legislacaoArquivo" accept=".pdf" class="w-full px-3 py-2 border border-gray-300 rounded-md" required>
                </div>
                <button type="submit" class="bg-blue-500 text-white px-6 py-2 rounded hover:bg-blue-600">
                    <i class="fas fa-plus mr-2"></i>Adicionar Legislação
                </button>
            </form>
            
            <!-- Lista de legislações -->
            <div id="legislacoesList" class="border-t pt-4">
                <h3 class="text-lg font-semibold mb-3">Legislações Cadastradas</h3>
                <div id="legislacoesContainer"></div>
            </div>
        </div>

        <!-- Seção de Alunos -->
        <div id="alunos" class="section bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-2xl font-bold mb-4">Alunos</h2>
            <div id="alunosList"></div>
        </div>

        <!-- Seção de Relatórios -->
        <div id="relatorios" class="section bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-2xl font-bold mb-4">Relatórios</h2>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Selecionar Aluno</label>
                <select id="alunoSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="">Carregando alunos...</option>
                </select>
            </div>
            
            <button onclick="gerarRelatorio()" class="bg-purple-500 text-white px-6 py-2 rounded hover:bg-purple-600 mb-4">
                <i class="fas fa-chart-bar mr-2"></i>Gerar Relatório
            </button>
            
            <div id="relatorioResult" class="mt-4"></div>
        </div>

        <!-- Seção de Entrevistas -->
        <div id="entrevistas" class="section bg-white rounded-lg shadow-md p-6 mb-6 hidden">
            <h2 class="text-2xl font-bold mb-4">Entrevistas</h2>
            <p class="text-gray-600">Funcionalidade de entrevistas - em desenvolvimento direto</p>
        </div>
        </div> <!-- Fim do mainContent -->
    </div>

    <script>
        // Configuração da API
        const API_BASE = '/conectedu/backend/api.php';
        
        // Configurar interceptador para incluir token
        axios.interceptors.request.use(config => {
            const token = localStorage.getItem('token');
            if (token) {
                config.params = config.params || {};
                config.params.token = token;
            }
            return config;
        });
        
        // Função para mostrar modal
        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            const modalIconClass = document.getElementById('modalIconClass');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            // Configurar ícone e cor baseado no tipo
            switch(type) {
                case 'success':
                    modalIcon.className = 'w-12 h-12 rounded-full mr-4 flex items-center justify-center bg-green-100';
                    modalIconClass.className = 'text-2xl fas fa-check-circle text-green-600';
                    break;
                case 'error':
                    modalIcon.className = 'w-12 h-12 rounded-full mr-4 flex items-center justify-center bg-red-100';
                    modalIconClass.className = 'text-2xl fas fa-times-circle text-red-600';
                    break;
                default:
                    modalIcon.className = 'w-12 h-12 rounded-full mr-4 flex items-center justify-center bg-blue-100';
                    modalIconClass.className = 'text-2xl fas fa-info-circle text-blue-600';
            }
            
            modal.classList.remove('hidden');
        }
        
        // Função para fechar modal
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
        
        // Função para fazer login
        async function fazerLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if (!email || !password) {
                showModal('Atenção', 'Preencha email e senha', 'info');
                return;
            }
            
            try {
                const response = await axios.post(API_BASE + '/auth/login', {
                    email: email,
                    password: password
                });
                
                if (response.data?.ok && response.data?.data?.token) {
                    localStorage.setItem('token', response.data.data.token);
                    document.getElementById('loginSection').classList.add('hidden');
                    document.getElementById('mainContent').classList.remove('hidden');
                    showModal('Sucesso', 'Login realizado com sucesso!', 'success');
                    carregarLegislacoes(); // Carregar dados iniciais
                } else {
                    showModal('Erro', 'Credenciais inválidas', 'error');
                }
            } catch (error) {
                showModal('Erro', 'Erro ao fazer login: ' + error.message, 'error');
            }
        }
        
        // Verificar se já está logado
        function verificarLogin() {
            const token = localStorage.getItem('token');
            if (token) {
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainContent').classList.remove('hidden');
                carregarLegislacoes();
            }
        }
        
        // Função para mostrar seção
        function showSection(sectionName) {
            // Esconder todas as seções
            const sections = document.querySelectorAll('.section');
            sections.forEach(section => section.classList.add('hidden'));
            
            // Mostrar seção selecionada
            document.getElementById(sectionName).classList.remove('hidden');
            
            // Carregar dados da seção
            if (sectionName === 'legislacoes') {
                carregarLegislacoes();
            } else if (sectionName === 'alunos') {
                carregarAlunos();
            } else if (sectionName === 'relatorios') {
                carregarAlunosSelect();
            }
        }
        
        // Função para carregar legislações
        async function carregarLegislacoes() {
            try {
                const response = await axios.get(API_BASE + '/legislacoes');
                console.log('Resposta da API:', response.data); // Debug
                
                let legislacoes = [];
                if (response.data?.ok && response.data?.data) {
                    // Se tem estrutura {ok: true, data: {...}}
                    legislacoes = response.data.data.rows || response.data.data || [];
                } else if (Array.isArray(response.data)) {
                    // Se é array direto
                    legislacoes = response.data;
                } else {
                    legislacoes = [];
                }
                
                const container = document.getElementById('legislacoesContainer');
                if (!Array.isArray(legislacoes) || legislacoes.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">Nenhuma legislação cadastrada</p>';
                } else {
                    container.innerHTML = legislacoes.map(leg => `
                        <div class="border rounded-lg p-4 mb-3">
                            <h4 class="font-semibold">${leg.titulo || leg.title || 'Sem título'}</h4>
                            <p class="text-gray-600">${leg.descricao || leg.description || 'Sem descrição'}</p>
                            <p class="text-xs text-gray-400">Arquivo: ${leg.nome_original || leg.arquivo_pdf || 'N/A'}</p>
                            <div class="mt-2 flex gap-2">
                                <a href="${API_BASE}/legislacoes/${leg.id}/download" target="_blank" class="text-blue-500 hover:underline">
                                    <i class="fas fa-download mr-1"></i>Baixar PDF
                                </a>
                                <button onclick="excluirLegislacao(${leg.id})" class="text-red-500 hover:underline">
                                    <i class="fas fa-trash mr-1"></i>Excluir
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showModal('Erro', 'Erro ao carregar legislações: ' + error.message, 'error');
            }
        }
        
        // Função para carregar alunos
        async function carregarAlunos() {
            try {
                const response = await axios.get(API_BASE + '/students');
                const alunos = response.data?.data?.rows || [];
                
                const container = document.getElementById('alunosList');
                if (alunos.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">Nenhum aluno cadastrado</p>';
                } else {
                    container.innerHTML = alunos.map(aluno => `
                        <div class="border rounded-lg p-4 mb-3">
                            <h4 class="font-semibold">${aluno.name}</h4>
                            <p class="text-gray-600">Modalidade: ${aluno.modalidade}</p>
                            <p class="text-gray-600">Escola: ${aluno.school || 'Não informada'}</p>
                        </div>
                    `).join('');
                }
            } catch (error) {
                showModal('Erro', 'Erro ao carregar alunos: ' + error.message, 'error');
            }
        }
        
        // Função para carregar alunos no select
        async function carregarAlunosSelect() {
            try {
                const response = await axios.get(API_BASE + '/students');
                const alunos = response.data?.data?.rows || [];
                
                const select = document.getElementById('alunoSelect');
                select.innerHTML = '<option value="">Selecione um aluno</option>' + 
                    alunos.map(aluno => `<option value="${aluno.id}">${aluno.name}</option>`).join('');
            } catch (error) {
                showModal('Erro', 'Erro ao carregar alunos: ' + error.message, 'error');
            }
        }
        
        // Função para gerar relatório
        async function gerarRelatorio() {
            const alunoId = document.getElementById('alunoSelect').value;
            if (!alunoId) {
                showModal('Atenção', 'Selecione um aluno primeiro', 'info');
                return;
            }
            
            try {
                const response = await axios.get(API_BASE + '/reports/student', {
                    params: { student_id: alunoId }
                });
                
                const data = response.data?.data;
                if (!data) {
                    showModal('Erro', 'Dados do relatório não encontrados', 'error');
                    return;
                }
                
                const container = document.getElementById('relatorioResult');
                container.innerHTML = `
                    <div class="border rounded-lg p-4">
                        <h3 class="text-lg font-semibold mb-3">Relatório de ${data.student.name}</h3>
                        
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <div>
                                <h4 class="font-medium text-gray-700">Informações Básicas</h4>
                                <p>Nome: ${data.student.name}</p>
                                <p>Escola: ${data.student.school || 'Não informada'}</p>
                                <p>Modalidade: ${data.student.modalidade}</p>
                            </div>
                            <div>
                                <h4 class="font-medium text-gray-700">Estatísticas</h4>
                                <p>Anamneses/Entrevistas: ${data.anamneses?.length || 0}</p>
                                <p>PDIs: ${data.pdis?.length || 0}</p>
                                <p>PAIs: ${data.pais?.length || 0}</p>
                            </div>
                        </div>
                        
                        ${data.anamneses && data.anamneses.length > 0 ? `
                            <div class="mt-4">
                                <h4 class="font-medium text-gray-700 mb-2">Entrevistas/Anamneses</h4>
                                ${data.anamneses.map(item => `
                                    <div class="border-l-4 border-blue-500 pl-4 mb-3">
                                        <p class="font-medium">
                                            ${item.tipo === 'entrevista_responsavel' ? 'Entrevista com Responsável' : 'Anamnese'}
                                        </p>
                                        <p class="text-sm text-gray-600">Data: ${new Date(item.created_at).toLocaleDateString('pt-BR')}</p>
                                        ${item.tipo === 'entrevista_responsavel' && item.answers.nome_estudante ? 
                                            `<p class="text-sm">Nome: ${item.answers.nome_estudante}</p>` : ''}
                                        ${item.tipo === 'entrevista_responsavel' && item.answers.nome_escola ? 
                                            `<p class="text-sm">Escola: ${item.answers.nome_escola}</p>` : ''}
                                    </div>
                                `).join('')}
                            </div>
                        ` : '<p class="text-gray-500 mt-4">Nenhuma entrevista ou anamnese encontrada</p>'}
                    </div>
                `;
                
                showModal('Sucesso', 'Relatório gerado com sucesso!', 'success');
            } catch (error) {
                showModal('Erro', 'Erro ao gerar relatório: ' + error.message, 'error');
            }
        }
        
        // Função para excluir legislação
        async function excluirLegislacao(id) {
            if (!confirm('Deseja realmente excluir esta legislação?')) return;
            
            try {
                await axios.delete(API_BASE + '/legislacoes/' + id);
                showModal('Sucesso', 'Legislação excluída com sucesso!', 'success');
                carregarLegislacoes();
            } catch (error) {
                showModal('Erro', 'Erro ao excluir legislação: ' + error.message, 'error');
            }
        }
        
        // Formulário de legislação
        document.getElementById('legislacaoForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const titulo = document.getElementById('legislacaoTitulo').value;
            const descricao = document.getElementById('legislacaoDescricao').value;
            const arquivo = document.getElementById('legislacaoArquivo').files[0];
            
            if (!arquivo) {
                showModal('Atenção', 'Selecione um arquivo PDF', 'info');
                return;
            }
            
            if (arquivo.type !== 'application/pdf') {
                showModal('Atenção', 'Apenas arquivos PDF são permitidos', 'info');
                return;
            }
            
            if (arquivo.size > 50 * 1024 * 1024) {
                showModal('Atenção', 'O arquivo deve ter no máximo 50MB', 'info');
                return;
            }
            
            const formData = new FormData();
            formData.append('titulo', titulo);
            formData.append('descricao', descricao);
            formData.append('arquivo', arquivo);
            
            try {
                await axios.post(API_BASE + '/legislacoes/upload', formData, {
                    headers: {
                        'Content-Type': 'multipart/form-data'
                    }
                });
                
                showModal('Sucesso', 'Legislação adicionada com sucesso!', 'success');
                document.getElementById('legislacaoForm').reset();
                carregarLegislacoes();
            } catch (error) {
                showModal('Erro', 'Erro ao adicionar legislação: ' + error.message, 'error');
            }
        });
        
        // Inicializar
        document.addEventListener('DOMContentLoaded', function() {
            verificarLogin();
        });
    </script>
</body>
</html>
