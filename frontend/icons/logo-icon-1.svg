<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradientes baseados no logo original -->
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7ED321;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#50E3C2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#50E3C2;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#50E3C2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7ED321;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fundo transparente -->
  <rect width="400" height="400" fill="transparent"/>
  
  <!-- Logo ConectAEE original recriado -->
  <g transform="translate(200,200)">
    <!-- Forma superior (verde-ciano) -->
    <path d="M0,-80 C-80,-40 -80,0 -40,40 C-20,50 20,50 40,40 C80,0 80,-40 0,-80 Z" fill="url(#topGrad)"/>
    <circle cx="0" cy="-40" r="16" fill="white"/>
    
    <!-- Forma inferior esquerda (azul-ciano) -->
    <path d="M-80,60 C-40,20 0,20 40,60 C50,80 50,120 40,140 C0,180 -40,180 -80,140 C-100,120 -100,80 -80,60 Z" fill="url(#leftGrad)"/>
    <circle cx="-40" cy="100" r="16" fill="white"/>
    
    <!-- Forma inferior direita (ciano-verde) -->
    <path d="M80,60 C120,80 120,120 80,140 C40,180 0,180 -40,140 C-50,120 -50,80 -40,60 C0,20 40,20 80,60 Z" fill="url(#rightGrad)"/>
    <circle cx="40" cy="100" r="16" fill="white"/>
    
    <!-- Triângulo central branco -->
    <path d="M0,20 L-30,80 L30,80 Z" fill="white"/>
  </g>
</svg>