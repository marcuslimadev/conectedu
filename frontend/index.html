<!-- Modal functionality -->
<script>
window.bootstrap = {
  Modal: class {
    constructor(el){ 
      this.el = el; 
    }
    show(){ 
      this.el.classList.add('tw-open'); 
      document.body.style.overflow = 'hidden';
      this.el.style.display = 'block';
    }
    hide(){ 
      this.el.classList.remove('tw-open'); 
      document.body.style.overflow = '';
      this.el.style.display = 'none';
    }
    static getInstance(el) {
      return new this(el);
    }
  }
};

// Fechar modal ao clicar no backdrop
document.addEventListener('click', function(e) {
  if (e.target.classList.contains('modal-backdrop')) {
    const modal = e.target.closest('.modal');
    if (modal) {
      bootstrap.Modal.getInstance(modal).hide();
    }
  }
});

// Fechar modal com ESC
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    const openModal = document.querySelector('.modal.tw-open');
    if (openModal) {
      bootstrap.Modal.getInstance(openModal).hide();
    }
  }
});
</script>

<!-- Vlibras com tratamento de erro -->
<div vw class="enabled">
  <div vw-access-button class="active"></div>
  <div vw-plugin-wrapper>
    <div class="vw-plugin-top-wrapper"></div>
  </div>
</div>
<script>
// Carregamento seguro do VLibras
(function() {
  // Timeout para carregamento do VLibras
  let vlibrasTimeout;
  
  function hideVLibras() {
    const vlibrasElements = document.querySelectorAll('[vw]');
    vlibrasElements.forEach(el => {
      el.style.display = 'none';
      el.classList.add('vlibras-error');
    });
  }
  
  function loadVLibras() {
    try {
      // Timeout de 10 segundos para carregamento
      vlibrasTimeout = setTimeout(() => {
        console.warn('VLibras: Timeout de carregamento excedido');
        hideVLibras();
      }, 10000);
      
      // Criar elemento script
      const script = document.createElement('script');
      script.src = 'https://vlibras.gov.br/app/vlibras-plugin.js';
      script.async = true;
      
      // Tratar carregamento bem-sucedido
      script.onload = function() {
        clearTimeout(vlibrasTimeout);
        
        try {
          if (window.VLibras && typeof window.VLibras.Widget === 'function') {
            // Adicionar proteção adicional contra erros do VLibras
            const originalEmit = EventTarget.prototype.emit;
            if (!originalEmit) {
              EventTarget.prototype.emit = function() {
                try {
                  if (this.dispatchEvent) {
                    return this.dispatchEvent.apply(this, arguments);
                  }
                } catch (e) {
                  console.warn('VLibras emit error:', e);
                }
              };
            }
            
            new window.VLibras.Widget('https://vlibras.gov.br/app');
          } else {
            console.warn('VLibras não foi carregado corretamente');
            hideVLibras();
          }
        } catch (e) {
          console.warn('Erro ao inicializar VLibras:', e);
          hideVLibras();
        }
      };
      
      // Tratar erro de carregamento
      script.onerror = function() {
        clearTimeout(vlibrasTimeout);
        console.warn('Falha ao carregar script do VLibras');
        hideVLibras();
      };
      
      // Adicionar ao head
      document.head.appendChild(script);
      
    } catch (e) {
      clearTimeout(vlibrasTimeout);
      console.warn('Erro ao configurar VLibras:', e);
      hideVLibras();
    }
  }
  
  // Aguardar DOM estar pronto
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', loadVLibras);
  } else {
    loadVLibras();
  }
})();
</script>

<!-- Acessibilidade com tratamento de erro -->
<script>
// Carregamento seguro do sistema de acessibilidade
(function() {
  try {
    const script = document.createElement('script');
    script.src = './a11y.js?v=5.0';
    script.async = true;
    
    script.onerror = function() {
      console.warn('Erro ao carregar sistema de acessibilidade');
    };
    
    document.head.appendChild(script);
  } catch (e) {
    console.warn('Erro ao configurar sistema de acessibilidade:', e);
  }
})();

// Proteção adicional contra erros globais
window.addEventListener('error', function(e) {
  // Suprimir erros do VLibras que não afetam o funcionamento
  if (e.message && e.message.includes('vlibras') || 
      e.filename && e.filename.includes('vlibras')) {
    e.preventDefault();
    return false;
  }
});
</script>
