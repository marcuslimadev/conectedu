<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConectAEE - Teste Direto</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4">
        <h1 class="text-3xl font-bold mb-6 text-center text-blue-600">ConectAEE - Teste API Direto</h1>
        
        <!-- Modal de Feedback -->
        <div id="modal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden z-50">
            <div class="flex items-center justify-center min-h-screen">
                <div class="bg-white rounded-lg p-6 max-w-md w-full mx-4">
                    <div class="flex items-center mb-4">
                        <div id="modalIcon" class="w-12 h-12 rounded-full mr-4 flex items-center justify-center">
                            <i id="modalIconClass" class="text-2xl"></i>
                        </div>
                        <h3 id="modalTitle" class="text-lg font-semibold"></h3>
                    </div>
                    <p id="modalMessage" class="text-gray-600 mb-4"></p>
                    <button onclick="closeModal()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 w-full">
                        OK
                    </button>
                </div>
            </div>
        </div>

        <!-- Seção de Testes -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">Testes da API</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <button onclick="testarEstudantes()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">
                    <i class="fas fa-users mr-2"></i>Testar Estudantes
                </button>
                <button onclick="testarRelatorios()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                    <i class="fas fa-chart-bar mr-2"></i>Testar Relatórios
                </button>
                <button onclick="testarEntrevistas()" class="bg-orange-500 text-white px-4 py-2 rounded hover:bg-orange-600">
                    <i class="fas fa-clipboard-list mr-2"></i>Testar Entrevistas
                </button>
                <button onclick="testarPDIs()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                    <i class="fas fa-tasks mr-2"></i>Testar PDIs
                </button>
            </div>
            
            <!-- Resultado dos testes -->
            <div id="resultados" class="border-t pt-4">
                <h3 class="text-lg font-semibold mb-3">Resultados dos Testes</h3>
                <div id="resultadosContainer" class="bg-gray-50 p-4 rounded-lg">
                    <p class="text-gray-500">Clique em um botão para testar a API</p>
                </div>
            </div>
        </div>

        <!-- Seção de Entrevistas -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-6">
            <h2 class="text-2xl font-bold mb-4">Teste de Entrevista Completa</h2>
            <p class="text-gray-600 mb-4">Vamos testar se os dados das entrevistas aparecem nos relatórios</p>
            
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-2">Selecionar Aluno</label>
                <select id="alunoSelect" class="w-full px-3 py-2 border border-gray-300 rounded-md">
                    <option value="">Carregando alunos...</option>
                </select>
            </div>
            
            <div class="flex gap-4">
                <button onclick="gerarRelatorioCompleto()" class="bg-purple-500 text-white px-6 py-2 rounded hover:bg-purple-600">
                    <i class="fas fa-chart-bar mr-2"></i>Gerar Relatório Completo
                </button>
                <button onclick="verificarEntrevistas()" class="bg-orange-500 text-white px-6 py-2 rounded hover:bg-orange-600">
                    <i class="fas fa-search mr-2"></i>Verificar Entrevistas
                </button>
            </div>
        </div>
        
    </div>

    <script>
        // Configuração da API
        const API_BASE = '/conectedu/backend/api.php';
        
        // Função para mostrar modal
        function showModal(title, message, type = 'info') {
            const modal = document.getElementById('modal');
            const modalTitle = document.getElementById('modalTitle');
            const modalMessage = document.getElementById('modalMessage');
            const modalIcon = document.getElementById('modalIcon');
            const modalIconClass = document.getElementById('modalIconClass');
            
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            switch(type) {
                case 'success':
                    modalIcon.className = 'w-12 h-12 rounded-full mr-4 flex items-center justify-center bg-green-100';
                    modalIconClass.className = 'text-2xl fas fa-check-circle text-green-600';
                    break;
                case 'error':
                    modalIcon.className = 'w-12 h-12 rounded-full mr-4 flex items-center justify-center bg-red-100';
                    modalIconClass.className = 'text-2xl fas fa-times-circle text-red-600';
                    break;
                default:
                    modalIcon.className = 'w-12 h-12 rounded-full mr-4 flex items-center justify-center bg-blue-100';
                    modalIconClass.className = 'text-2xl fas fa-info-circle text-blue-600';
            }
            
            modal.classList.remove('hidden');
        }
        
        function closeModal() {
            document.getElementById('modal').classList.add('hidden');
        }
        
        function mostrarResultado(titulo, dados) {
            const container = document.getElementById('resultadosContainer');
            container.innerHTML = `
                <h4 class="font-bold text-lg mb-2">${titulo}</h4>
                <pre class="bg-gray-100 p-3 rounded text-sm overflow-auto max-h-96">${JSON.stringify(dados, null, 2)}</pre>
            `;
        }
        
        // Testar estudantes sem autenticação
        async function testarEstudantes() {
            try {
                // Fazer requisição direta sem token
                const response = await fetch(API_BASE + '/students', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                mostrarResultado('Estudantes (Status: ' + response.status + ')', data);
                
                if (response.ok) {
                    showModal('Sucesso', 'Estudantes carregados com sucesso!', 'success');
                    // Carregar no select
                    const alunos = data?.data?.rows || [];
                    const select = document.getElementById('alunoSelect');
                    select.innerHTML = '<option value="">Selecione um aluno</option>' + 
                        alunos.map(aluno => `<option value="${aluno.id}">${aluno.name}</option>`).join('');
                } else {
                    showModal('Erro', 'Erro ao carregar estudantes: ' + (data.error || response.status), 'error');
                }
            } catch (error) {
                showModal('Erro', 'Erro de conexão: ' + error.message, 'error');
                mostrarResultado('Erro de Conexão', {error: error.message});
            }
        }
        
        // Testar relatórios
        async function testarRelatorios() {
            try {
                const response = await fetch(API_BASE + '/reports/student?student_id=1', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                mostrarResultado('Relatório do Aluno 1 (Status: ' + response.status + ')', data);
                
                if (response.ok) {
                    showModal('Sucesso', 'Relatório gerado com sucesso!', 'success');
                } else {
                    showModal('Erro', 'Erro ao gerar relatório: ' + (data.error || response.status), 'error');
                }
            } catch (error) {
                showModal('Erro', 'Erro de conexão: ' + error.message, 'error');
                mostrarResultado('Erro de Conexão', {error: error.message});
            }
        }
        
        // Testar entrevistas
        async function testarEntrevistas() {
            try {
                const response = await fetch(API_BASE + '/entrevistas-responsavel/list', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                mostrarResultado('Entrevistas (Status: ' + response.status + ')', data);
                
                if (response.ok) {
                    showModal('Sucesso', 'Entrevistas carregadas com sucesso!', 'success');
                } else {
                    showModal('Erro', 'Erro ao carregar entrevistas: ' + (data.error || response.status), 'error');
                }
            } catch (error) {
                showModal('Erro', 'Erro de conexão: ' + error.message, 'error');
                mostrarResultado('Erro de Conexão', {error: error.message});
            }
        }
        
        // Testar PDIs
        async function testarPDIs() {
            try {
                const response = await fetch(API_BASE + '/pdi?student_id=1', {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                mostrarResultado('PDIs do Aluno 1 (Status: ' + response.status + ')', data);
                
                if (response.ok) {
                    showModal('Sucesso', 'PDIs carregados com sucesso!', 'success');
                } else {
                    showModal('Erro', 'Erro ao carregar PDIs: ' + (data.error || response.status), 'error');
                }
            } catch (error) {
                showModal('Erro', 'Erro de conexão: ' + error.message, 'error');
                mostrarResultado('Erro de Conexão', {error: error.message});
            }
        }
        
        // Gerar relatório completo
        async function gerarRelatorioCompleto() {
            const alunoId = document.getElementById('alunoSelect').value;
            if (!alunoId) {
                showModal('Atenção', 'Selecione um aluno primeiro', 'info');
                return;
            }
            
            try {
                const response = await fetch(API_BASE + '/reports/student?student_id=' + alunoId, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok && data.ok) {
                    const student = data.data.student;
                    const anamneses = data.data.anamneses || [];
                    const entrevistas = anamneses.filter(item => item.tipo === 'entrevista_responsavel');
                    
                    mostrarResultado(`Relatório Completo - ${student.name}`, {
                        aluno: student,
                        total_anamneses: anamneses.length,
                        total_entrevistas: entrevistas.length,
                        anamneses: anamneses,
                        entrevistas: entrevistas,
                        pdis: data.data.pdis || [],
                        pais: data.data.pais || []
                    });
                    
                    showModal('Sucesso', `Relatório gerado! ${entrevistas.length} entrevistas encontradas`, 'success');
                } else {
                    mostrarResultado('Erro no Relatório', data);
                    showModal('Erro', 'Erro ao gerar relatório: ' + (data.error || response.status), 'error');
                }
            } catch (error) {
                showModal('Erro', 'Erro de conexão: ' + error.message, 'error');
                mostrarResultado('Erro de Conexão', {error: error.message});
            }
        }
        
        // Verificar entrevistas especificamente
        async function verificarEntrevistas() {
            const alunoId = document.getElementById('alunoSelect').value;
            if (!alunoId) {
                showModal('Atenção', 'Selecione um aluno primeiro', 'info');
                return;
            }
            
            try {
                // Buscar entrevistas diretamente
                const responseEntrevistas = await fetch(API_BASE + '/entrevistas-responsavel/list', {
                    method: 'GET'
                });
                
                const dataEntrevistas = await responseEntrevistas.json();
                
                // Buscar relatório do aluno
                const responseRelatorio = await fetch(API_BASE + '/reports/student?student_id=' + alunoId, {
                    method: 'GET'
                });
                
                const dataRelatorio = await responseRelatorio.json();
                
                mostrarResultado('Verificação de Entrevistas', {
                    aluno_id: alunoId,
                    entrevistas_diretas: dataEntrevistas,
                    relatorio_completo: dataRelatorio,
                    status_entrevistas: responseEntrevistas.status,
                    status_relatorio: responseRelatorio.status
                });
                
                if (responseRelatorio.ok && dataRelatorio.ok) {
                    const anamneses = dataRelatorio.data.anamneses || [];
                    const entrevistas = anamneses.filter(item => item.tipo === 'entrevista_responsavel');
                    showModal('Info', `Encontradas ${entrevistas.length} entrevistas no relatório`, 'info');
                } else {
                    showModal('Erro', 'Erro na verificação', 'error');
                }
                
            } catch (error) {
                showModal('Erro', 'Erro de conexão: ' + error.message, 'error');
                mostrarResultado('Erro de Conexão', {error: error.message});
            }
        }
        
        // Inicializar carregando estudantes
        document.addEventListener('DOMContentLoaded', function() {
            testarEstudantes();
        });
    </script>
</body>
</html>
