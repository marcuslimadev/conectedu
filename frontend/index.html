  <!-- PWA completamente desabilitado -->
  <script>
    // Remover qualquer service worker existente
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => {
          registration.unregister();
          console.log('🧹 Service Worker removido completamente');
        });
      });
    }

    // Limpar todos os caches
    if ('caches' in window) {
      caches.keys().then(cacheNames => {
        cacheNames.forEach(cacheName => {
          caches.delete(cacheName);
          console.log('🧹 Cache removido:', cacheName);
        });
      });
    }
    
    // Forçar recarga se versão antiga detectada
    const CURRENT_VERSION = '20251212-pai-titles-v2';
    const storedVersion = sessionStorage.getItem('app_version');
    if (storedVersion !== CURRENT_VERSION) {
      console.log('🔄 Nova versão detectada, limpando cache...');
      sessionStorage.setItem('app_version', CURRENT_VERSION);
      // Força recarga sem cache
      if (performance.navigation.type !== 1) {
        window.location.reload(true);
      }
    }
  </script>
  <link rel="stylesheet" href="./tailwind-local.css">
  <script>
    // Tailwind CSS carregado localmente
    console.log('✅ Tailwind CSS carregado sem versioning');

    // Limpar cache automaticamente se necessário
    if ('caches' in window) {
      caches.keys().then(names => {
        names.forEach(name => {
          if (name.includes('conectedu')) {
            caches.delete(name);
            console.log('🧹 Cache limpo automaticamente:', name);
          }
        });
      });
    }

    // Forçar reload se detectar versão antiga no localStorage
    const currentVersion = '5.0';
    const storedVersion = localStorage.getItem('app_version');
    if (storedVersion && storedVersion !== currentVersion) {
      localStorage.setItem('app_version', currentVersion);
      console.log('🔄 Versão atualizada, limpando dados antigos');
      // Não fazer reload automático, apenas limpar dados
      localStorage.removeItem('token'); // Força novo login
    } else if (!storedVersion) {
      localStorage.setItem('app_version', currentVersion);
    }
  </script>

  <!-- Modal functionality -->
  <script>
    window.bootstrap = {
      Modal: class {
        constructor(el) {
          this.el = el;
        }
        show() {
          this.el.classList.add('tw-open');
          document.body.style.overflow = 'hidden';
          this.el.style.display = 'block';
        }
        hide() {
          this.el.classList.remove('tw-open');
          document.body.style.overflow = '';
          this.el.style.display = 'none';
        }
        static getInstance(el) {
          return new this(el);
        }
      }
    };

    // Fechar modal ao clicar no backdrop
    document.addEventListener('click', function (e) {
      if (e.target.classList.contains('modal-backdrop')) {
        const modal = e.target.closest('.modal');
        if (modal) {
          bootstrap.Modal.getInstance(modal).hide();
        }
      }
    });

    // Fechar modal com ESC
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const openModal = document.querySelector('.modal.tw-open');
        if (openModal) {
          bootstrap.Modal.getInstance(openModal).hide();
        }
      }
    });
  </script>
