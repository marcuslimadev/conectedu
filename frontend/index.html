  <!-- PWA completamente desabilitado -->
  <script>
    // Remover qualquer service worker existente
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(registrations => {
        registrations.forEach(registration => {
          registration.unregister();
          console.log('🧹 Service Worker removido completamente');
        });
      });
    }

    // Limpar todos os caches
    if ('caches' in window) {
      caches.keys().then(cacheNames => {
        cacheNames.forEach(cacheName => {
          caches.delete(cacheName);
          console.log('🧹 Cache removido:', cacheName);
        });
      });
    }
    
    // Forçar recarga se versão antiga detectada
    const CURRENT_VERSION = '20251212-pai-titles-v2';
    const storedVersion = sessionStorage.getItem('app_version');
    if (storedVersion !== CURRENT_VERSION) {
      console.log('🔄 Nova versão detectada, limpando cache...');
      sessionStorage.setItem('app_version', CURRENT_VERSION);
      // Força recarga sem cache
      if (performance.navigation.type !== 1) {
        window.location.reload(true);
      }
    }
  </script>
  <link rel="stylesheet" href="./tailwind-local.css">
  <script>
    // Tailwind CSS carregado localmente
    console.log('✅ Tailwind CSS carregado sem versioning');

    // Limpar cache automaticamente se necessário
    if ('caches' in window) {
      caches.keys().then(names => {
        names.forEach(name => {
          if (name.includes('conectedu')) {
            caches.delete(name);
            console.log('🧹 Cache limpo automaticamente:', name);
          }
        });
      });
    }

    // Forçar reload se detectar versão antiga no localStorage
    const currentVersion = '5.0';
    const storedVersion2 = localStorage.getItem('app_version');
    if (storedVersion2 && storedVersion2 !== currentVersion) {
      localStorage.setItem('app_version', currentVersion);
      console.log('🔄 Versão atualizada, limpando dados antigos');
      // Não fazer reload automático, apenas limpar dados
      localStorage.removeItem('token'); // Força novo login
    } else if (!storedVersion2) {
      localStorage.setItem('app_version', currentVersion);
    }
  </script>

    .home-landing {

    .landing-card {

      background: var(--accent-soft);
      color: var(--accent-color);
    }

    .landing-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .landing-card-text {
      color: var(--landing-muted);
      line-height: 1.6;
    }

    .landing-step {
      display: flex;
      gap: 1rem;
      background: rgba(10, 16, 26, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 18px;
      padding: 1.1rem 1.35rem;
    }

    .landing-step-number {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #020617;
      background: var(--accent-color);
    }

    .landing-step-title {
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .landing-step-text {
      color: var(--landing-muted);
      font-size: 0.9rem;
    }

    .landing-module {
      background: rgba(10, 17, 28, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 1.75rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }

    .landing-module:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.4);
    }

    .landing-module-icon {
      width: 46px;
      height: 46px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      background: var(--accent-soft);
      color: var(--accent-color);
    }

    .landing-module-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .landing-module-text {
      color: var(--landing-muted);
      line-height: 1.6;
      margin-bottom: 0.8rem;
    }

    .landing-tag {
      display: inline-flex;
      align-items: center;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      border: 1px solid var(--accent-color);
      color: var(--accent-color);
    }

    .landing-check {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      color: var(--landing-muted);
      font-size: 0.95rem;
    }

    .landing-check i {
      color: #22c55e;
    }

    .landing-report {
      background: rgba(10, 17, 28, 0.9);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 1.8rem;
    }

    .landing-report-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }

    .landing-report-title {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .landing-report-sub {
      font-size: 0.85rem;
      color: var(--landing-muted);
    }

    .landing-report-body {
      display: grid;
      gap: 1rem;
    }

    .landing-report-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--landing-muted);
      font-size: 0.9rem;
    }

    .landing-report-chart {
      display: flex;
      align-items: flex-end;
      gap: 0.4rem;
      height: 120px;
      background: rgba(15, 23, 42, 0.5);
      border-radius: 18px;
      padding: 0.8rem;
    }

    .landing-report-chart span {
      flex: 1;
      border-radius: 10px;
      background: linear-gradient(180deg, #22d3ee, #0ea5e9);

      transform-origin: bottom;

    .landing-report-chart span:nth-child(2) {
      animation-delay: -0.5s;
    }

    .landing-report-chart span:nth-child(3) {
      animation-delay: -1s;
    }

    .landing-report-chart span:nth-child(4) {
      animation-delay: -1.5s;
    }

    .landing-report-chart span:nth-child(5) {
      animation-delay: -2s;
    }

    .landing-report-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--landing-muted);
    }

    .landing-report-tag {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.5);
      color: #22d3ee;
    }

    .landing-access {
      display: grid;
      gap: 1.4rem;
    }

    .landing-access-card {
      background: rgba(10, 17, 28, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 22px;
      padding: 1.6rem;
    }

    .landing-access-card.secondary {
      background: rgba(14, 23, 36, 0.9);
    }

    .landing-access-title {
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .landing-access-text {
      color: var(--landing-muted);
      margin-bottom: 0.8rem;
    }

    .landing-access-options {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .landing-access-options span {
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(34, 211, 238, 0.15);
      color: #67e8f9;
      font-size: 0.8rem;
    }

    .landing-governance {
      display: grid;
      gap: 1rem;
      background: rgba(10, 17, 28, 0.85);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 1.8rem;
    }

    .landing-governance-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 0.6rem;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.2);
    }

    .landing-governance-item:last-child {
      border-bottom: none;
      padding-bottom: 0;
    }

    .landing-governance-label {
      color: var(--landing-muted);
      font-size: 0.9rem;
    }

    .landing-cta {
      padding: 5.5rem 0 6.5rem;
      background: linear-gradient(135deg, rgba(34, 211, 238, 0.12), rgba(245, 158, 11, 0.12));
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    .landing-cta-title {
      font-size: clamp(2rem, 3.6vw, 3rem);
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .landing-cta-text {
      color: var(--landing-muted);
      margin-bottom: 2rem;
    }

    .landing-footer {
      padding: 4.5rem 0 3.5rem;
      background: rgba(8, 13, 21, 0.95);
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    .landing-footer-text {
      color: var(--landing-muted);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    .landing-footer-title {
      font-weight: 700;
      margin-bottom: 0.8rem;
    }

    .landing-footer-list {
      display: grid;
      gap: 0.4rem;
      color: var(--landing-muted);
      font-size: 0.9rem;
    }

    .landing-footer-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      border-top: 1px solid rgba(148, 163, 184, 0.12);
      padding-top: 2rem;
      color: var(--landing-muted);
      font-size: 0.85rem;
    }

    .landing-modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      z-index: 60;
    }

    .landing-modal {
      position: relative;
      width: min(96vw, 420px);
      background: rgba(10, 17, 28, 0.95);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 24px;
      padding: 2rem 1.8rem;
      box-shadow: 0 30px 60px rgba(2, 6, 23, 0.6);
    }

    .landing-modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.2);
      color: var(--landing-muted);
      background: transparent;
    }

    .landing-modal-head {
      margin-bottom: 1.4rem;
    }

    .landing-modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 0.3rem;
    }

    .landing-modal-sub {
      color: var(--landing-muted);
      font-size: 0.9rem;
    }

    .landing-modal-tabs {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
      background: rgba(15, 23, 42, 0.7);
      padding: 0.4rem;
      border-radius: 12px;
      margin-bottom: 1.4rem;
    }

    .landing-modal-tab {
      padding: 0.5rem 0.8rem;
      border-radius: 10px;
      color: var(--landing-muted);
      font-weight: 600;
    }

    .landing-modal-tab.active {
      background: rgba(34, 211, 238, 0.2);
      color: #67e8f9;
    }

    .landing-label {
      display: block;
      font-size: 0.85rem;
      color: var(--landing-muted);
      margin-bottom: 0.35rem;
    }

    .landing-input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      border-radius: 12px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.7);
      color: var(--landing-text);
    }

    .landing-input:focus {
      outline: none;
      border-color: #22d3ee;
      box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2);
    }

    .landing-input-wrap {
      position: relative;
    }

    .landing-input-toggle {
      position: absolute;
      top: 50%;
      right: 0.75rem;
      transform: translateY(-50%);
      color: var(--landing-muted);
      background: transparent;
    }

    .landing-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      font-size: 0.85rem;
    }

    .landing-checkbox {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--landing-muted);
    }

    .landing-link {
      color: #67e8f9;
      font-size: 0.85rem;
    }

    .landing-alert {
      padding: 0.6rem 0.8rem;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    .landing-alert.error {
      background: rgba(239, 68, 68, 0.15);
      color: #fecaca;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .landing-alert.success {
      background: rgba(34, 197, 94, 0.15);
      color: #bbf7d0;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }

    .landing-alert.warning {
      background: rgba(245, 158, 11, 0.15);
      color: #fde68a;
      border: 1px solid rgba(245, 158, 11, 0.4);
      margin-top: 0.5rem;
    }

    .landing-password-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.3rem 0.6rem;
      font-size: 0.75rem;
      color: var(--landing-muted);
      margin-top: 0.6rem;
    }

    .landing-password-grid span.ok {
      color: #22c55e;
    }

    .landing-modal-foot {
      font-size: 0.75rem;
      color: var(--landing-muted);
      text-align: center;
      margin-top: 0.6rem;
    }

    .landing-spinner {
      width: 16px;
      height: 16px;
      border-radius: 999px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      animation: landing-spin 1s linear infinite;
    }

    .landing-rise {
      opacity: 0;
      transform: translateY(16px);
      animation: landing-rise 0.8s ease forwards;
    }

    .landing-float {
      animation: landing-float 8s ease-in-out infinite;
    }

    @keyframes landing-rise {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes landing-float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    @keyframes landing-marquee {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-50%);
      }
    }

    @keyframes landing-bars {
      0%, 100% {
        transform: scaleY(0.85);
      }
      50% {
        transform: scaleY(1);
      }
    }

    @keyframes landing-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @media (min-width: 1024px) {
      .landing-hero-body {
        padding-top: 6.5rem;
        padding-bottom: 6.5rem;
      }

      .landing-hero-body > .grid {
        gap: 4.5rem;
      }

      .landing-section {
        padding: 6.5rem 0;
      }
    }

    @media (max-width: 1024px) {
      .landing-float-card {
        position: static;
        margin-top: 1rem;
        max-width: none;
      }

      .landing-showcase {
        display: grid;
        gap: 1.2rem;
      }

      .landing-footer-bottom {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 640px) {
      .landing-title {
        font-size: 2.4rem;
      }

      .landing-section {
        padding: 4rem 0;
      }

      .landing-report-chart {
        height: 90px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .landing-rise,
      .landing-float,
      .landing-marquee-track,
      .landing-report-chart span,
      .landing-spinner {
        animation: none !important;
      }

      .landing-rise {
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>

  <script src="https://unpkg.com/vue-router@4.4.5/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.4/dist/axios.min.js"></script>
  <script src="https://code.highcharts.com/highcharts.js"></script>
  <!-- Scripts principais sem cache forçado -->
  <script src="./config.js"></script>
  <script src="./a11y.js"></script>
  <script src="./test-load.js"></script>
  <script src="./date-picker-component.js"></script>
  <script src="./dados-teste-automatizado.js"></script>
  <script src="./painel-desenvolvimento.js"></script>
  <script src="./formularios-completos.js"></script>
  <script src="./wizard-forms.js"></script>
  <script src="./formularios-aee-completos.js"></script>
  <script src="./entrevista-wizard-completa.js"></script>
  <script>document.write('<script src="./spa-tailwind.js?v=20251212-pai-completo-' + Date.now() + '"><\/script>');</script>

  <!-- Modal functionality -->
  <script>
    window.bootstrap = {
      Modal: class {
        constructor(el) {
          this.el = el;
        }
        show() {
          this.el.classList.add('tw-open');
          document.body.style.overflow = 'hidden';
          this.el.style.display = 'block';
        }
        hide() {
          this.el.classList.remove('tw-open');
          document.body.style.overflow = '';
          this.el.style.display = 'none';
        }
        static getInstance(el) {
          return new this(el);
        }
      }
    };

    // Fechar modal ao clicar no backdrop
    document.addEventListener('click', function (e) {
      if (e.target.classList.contains('modal-backdrop')) {
        const modal = e.target.closest('.modal');
        if (modal) {
          bootstrap.Modal.getInstance(modal).hide();
        }
      }
    });

    // Fechar modal com ESC
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        const openModal = document.querySelector('.modal.tw-open');
        if (openModal) {
          bootstrap.Modal.getInstance(openModal).hide();
        }
      }
    });
  </script>
